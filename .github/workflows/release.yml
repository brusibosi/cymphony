name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: .

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-release-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-release-

      - name: Install dependencies
        env:
          BURRITO_BUILD: "1"
        run: mix deps.get

      - name: Build burrito release
        env:
          BURRITO_BUILD: "1"
          MIX_ENV: prod
        run: mix release --overwrite

      - name: Upload all binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cymphony-binaries
          path: burrito_out/*

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: cymphony-binaries
          path: ./artifacts

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY=$(ls artifacts/cymphony_linux | head -n 1)

          mkdir -p pkg/usr/bin
          cp "$BINARY" pkg/usr/bin/cymphony
          chmod +x pkg/usr/bin/cymphony

          fpm -s dir -t deb \
            -n cymphony \
            -v "$VERSION" \
            --architecture amd64 \
            --description "Cymphony - multi-harness Linear coding-agent orchestrator" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "Cymphony Authors" \
            --license "Apache-2.0" \
            --prefix / \
            -C pkg \
            .

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cymphony-deb
          path: ./*.deb

  release:
    needs: [build, package-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all binaries
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: cymphony-binaries
          path: ./artifacts

      - name: Download .deb artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: cymphony-deb
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cymphony ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
